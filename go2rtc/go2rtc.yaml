api:
  listen: ":1984"
  username: "${GO2RTC_API_USERNAME}"
  password: "${GO2RTC_API_PASSWORD}"
  local_auth: true
  allow_paths:
    - /api/streams
    - /api/frame.jpeg

rtsp:
  listen: ":8554"
  username: "${RTSP_USERNAME}"
  password: "${RTSP_PASSWORD}"
  default_query: "video&audio"

ffmpeg:
  rtkey_http: >-
    -fflags +genpts+discardcorrupt -flags low_delay
    -use_wallclock_as_timestamps 1 -rw_timeout 20000000
    -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1
    -reconnect_on_network_error 1 -reconnect_on_http_error 4xx,5xx
    -reconnect_delay_max 5 -i {input}
  rtkey_h264_stable: >-
    -codec:v libx264 -r:v ${VIDEO_FPS} -fps_mode cfr
    -g:v ${VIDEO_FPS} -keyint_min ${VIDEO_FPS} -sc_threshold 0
    -preset:v superfast -tune:v zerolatency -profile:v main -level:v 4.1

webrtc:
  listen: ""

streams: {}
