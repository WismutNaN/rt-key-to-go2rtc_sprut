api:
  listen: ":1984"
  username: "${GO2RTC_API_USERNAME}"
  password: "${GO2RTC_API_PASSWORD}"
  local_auth: true
  allow_paths:
    - /api/streams
    - /api/frame.jpeg

rtsp:
  listen: ":8554"
  username: "${RTSP_USERNAME}"
  password: "${RTSP_PASSWORD}"
  default_query: "video&audio"

ffmpeg:
  rtkey_http: >-
    -fflags +genpts+discardcorrupt+nobuffer -flags low_delay
    -rw_timeout 15000000
    -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1
    -reconnect_on_network_error 1 -reconnect_on_http_error 4xx,5xx
    -reconnect_delay_max 2 -i {input}
  rtkey_h264_copy: >-
    -codec:v copy -copytb 1

webrtc:
  listen: ""

streams: {}
