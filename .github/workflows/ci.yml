name: offline-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and run offline tests
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src tests
          python -m unittest discover -v

      - name: Check shell syntax
        run: bash -n install.sh manage.sh uninstall.sh scripts/secrets.sh

      - name: Validate Compose model without starting containers
        run: |
          cp .env.example .env
          mkdir -m 700 secrets
          printf 'test.header.signature' > secrets/rtkey_access_token
          chmod 444 secrets/rtkey_access_token
          docker compose config --quiet
